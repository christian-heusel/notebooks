# NOTE: unlike `manifests.yaml`, this file is NOT generated by controller-gen, because the
#       `+kubebuilder:webhook` marker cannot express `matchConditions` or `scope`
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: workspaces-mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: workspaces-webhook-service
      namespace: system
      path: /mutate-workspace-created-resource
  # NOTE: this webhook matches the creation of almost every namespaced resource, so it must never
  #       be able to block one, resources created while it is unreachable are simply not tracked
  failurePolicy: Ignore
  matchConditions:
  # only the ServiceAccount of a Workspace, creating a resource in its own Namespace
  # NOTE: "ws-" is the `WorkspaceServiceAccountNamePrefix` of the controller, keep them in sync
  - name: created-by-workspace-serviceaccount
    expression: "request.userInfo.username.startsWith('system:serviceaccount:' + request.namespace + ':ws-')"
  # resources which are not persisted, or are too short-lived and numerous to be worth tracking
  - name: exclude-untracked-resources
    expression: >-
      !(request.resource.group in ['authentication.k8s.io', 'authorization.k8s.io', 'coordination.k8s.io', 'events.k8s.io'])
      && !(request.resource.group == '' && request.resource.resource in ['bindings', 'events'])
  name: mcreatedresource.kb.io
  rules:
  # NOTE: "*" does not match subresources, like "pods/exec"
  - apiGroups:
    - "*"
    apiVersions:
    - "*"
    operations:
    - CREATE
    resources:
    - "*"
    scope: Namespaced
  sideEffects: None
  timeoutSeconds: 5
