apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dev-user-workspaces
subjects:
  - kind: User
    name: user
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: kubeflow-workspaces-edit
  apiGroup: rbac.authorization.k8s.io
---
# Dev supplement: PVC and secret management in the user's profile namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dev-user-resources
rules:
- apiGroups:
  - ""
  resources:
  - persistentvolumeclaims
  verbs:
  - create
  - delete
  - get
  - list
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - update
# the backend only shows the resources created by a Workspace to users who may list their kind
- apiGroups:
  - ""
  resources:
  - configmaps
  - pods
  - services
  verbs:
  - list
- apiGroups:
  - apps
  resources:
  - daemonsets
  - deployments
  - replicasets
  - statefulsets
  verbs:
  - list
- apiGroups:
  - batch
  resources:
  - cronjobs
  - jobs
  verbs:
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dev-user-resources
subjects:
  - kind: User
    name: user
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: dev-user-resources
  apiGroup: rbac.authorization.k8s.io
